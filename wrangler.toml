# מאמן שינה: Worker אחד עם קבצים סטטיים, מסד D1 ודומיין קבוע.
# חשבון: Lior@thefrenkel.com's Account. יש שני חשבונות ב-wrangler, לכן הסקריפטים מגדירים CLOUDFLARE_ACCOUNT_ID.
name = "sleep-coach"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

# דומיין קבוע: ההתחברות, ההתראות, מפתח Face ID עתידי והחיבור לגוגל קשורים לכתובת הזו.
routes = [{ pattern = "sleep.adaptation.work", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]          # הקבצים הסטטיים מוגשים בלי להפעיל קוד. הנתונים רק דרך ה-API
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "sleep-coach"
database_id = "1c476510-7174-4151-8872-cc85a83762ee"     # deploy.sh יוצר את המסד וממלא כאן
migrations_dir = "migrations"

[vars]                                  # לא סודי
APP_URL = "https://sleep.adaptation.work"
PERSONA = "friend"                      # מי המשתמש: src/persona.js

[observability]
enabled = true

# סודות (מוגדרים בטרמינל, לא בקובץ): SESSION_SECRET, DATA_KEY (נוצרים אקראית ב-deploy.sh),
# LOGIN_PEPPER, PASS_VERIFIER, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GEMINI_API_KEY (דרך set-secrets.sh)

# ===== הפריסה של ליאור: אותו קוד, Worker ומסד נפרדים, דומיין משלו =====
# פריסה: bash deploy.sh lior  (או bash deploy.sh כדי לעדכן את שתיהן). שם ה-Worker יהיה sleep-coach-lior.
# ב-wrangler, מסדים ומשתנים לא עוברים בירושה לסביבה, ולכן מוגדרים כאן שוב. גם הסודות נפרדים: bash set-secrets.sh lior
[env.lior]
routes = [{ pattern = "lior.sleep.adaptation.work", custom_domain = true }]

[[env.lior.d1_databases]]
binding = "DB"
database_name = "sleep-coach-lior"
database_id = "REPLACE_WITH_LIOR_D1_ID"     # deploy.sh יוצר את המסד וממלא כאן
migrations_dir = "migrations"

[env.lior.vars]
APP_URL = "https://lior.sleep.adaptation.work"
PERSONA = "lior"
