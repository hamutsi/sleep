# Local-only config used by the test scripts (mock Gemini on :8799, fake D1 id, test entry with probe routes).
name = "sleep-coach-test"
main = "src/test-entry.js"
compatibility_date = "2026-03-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "sleep-coach-test"
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
GEMINI_BASE = "http://127.0.0.1:8799/v1beta"
