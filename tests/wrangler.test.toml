# הגדרה לבדיקות מקומיות בלבד. הנתיבים יחסיים לתיקייה הזו.
name = "sleep-coach-test"
main = "../src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "sleep-coach-test"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../migrations"
